# Stack completo: db + backend + frontend.
# Pensado para correr en servidor local (sin Dokploy/Traefik).
#
# Uso local:
#   docker compose up -d
#   Frontend: http://localhost:52052
#   Backend API: http://localhost:8000
#
# Para desplegar solo el frontend en otro host: docker-compose.frontend.yml
# Para desplegar en Dokploy con Traefik: docker compose -f docker-compose.yml -f docker-compose.dokploy.yml up -d
# Desarrollo con hot reload (Angular + Python): docker compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/assistant}
      PROJECT_NAME: ${PROJECT_NAME:-Moodle Wrapper}
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      SERVER_MASTER_KEY: ${SERVER_MASTER_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Panama}
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-Moodle Wrapper}
      MAILERSEND_TO_EMAIL: ${MAILERSEND_TO_EMAIL:-}
      PYTHONUNBUFFERED: "1"
    ports:
      - "8000:8000"
    networks:
      - app-network
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: [ "sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health').read()" ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./assistant-frontend
      dockerfile: Dockerfile
    ports:
      - "52052:80"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8000}
    networks:
      - app-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://localhost/ > /dev/null 2>&1 || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
