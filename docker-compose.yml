# Stack completo: db + backend + frontend.
# Para desplegar solo el frontend en otro host, usa docker-compose.frontend.yml.
#
# Dokploy deployment:
# 1. Los servicios deben estar en la red "dokploy-network" para que Traefik los alcance.
# 2. Las etiquetas Traefik configuran dominios y HTTPS automáticamente mediante variables de entorno.
# 3. Configura FRONTEND_DOMAIN, BACKEND_DOMAIN y TRAEFIK_CERTRESOLVER en las variables de entorno.
# 4. NO añadas dominios en la UI de Dokploy si usas las etiquetas Traefik (evita duplicados).
# 5. Para deshabilitar Traefik labels, usa TRAEFIK_ENABLE_FRONTEND=false y TRAEFIK_ENABLE_BACKEND=false

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: assistant
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://postgres:postgres@db:5432/assistant}
      PROJECT_NAME: ${PROJECT_NAME:-Moodle Wrapper}
      MOODLE_BASE_URL: ${MOODLE_BASE_URL:-}
      SERVER_MASTER_KEY: ${SERVER_MASTER_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Panama}
      MAILERSEND_API_KEY: ${MAILERSEND_API_KEY:-}
      MAILERSEND_FROM_EMAIL: ${MAILERSEND_FROM_EMAIL:-}
      MAILERSEND_FROM_NAME: ${MAILERSEND_FROM_NAME:-Moodle Wrapper}
      MAILERSEND_TO_EMAIL: ${MAILERSEND_TO_EMAIL:-}
      PYTHONUNBUFFERED: "1"
    networks:
      - app-network
      - dokploy-network
    depends_on:
      - db
    command: [ "sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000" ]
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health').read()" ]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      # Traefik configuration for backend
      - "traefik.enable=${TRAEFIK_ENABLE_BACKEND:-true}"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_DOMAIN:-api-study.suantechs.com}`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.backend.loadbalancer.server.port=8000"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.backend-http.rule=Host(`${BACKEND_DOMAIN:-api-study.suantechs.com}`)"
      - "traefik.http.routers.backend-http.entrypoints=web"
      - "traefik.http.routers.backend-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

  frontend:
    build:
      context: ./assistant-frontend
      dockerfile: Dockerfile
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8000}
    networks:
      - app-network
      - dokploy-network
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD-SHELL", "wget --spider -q http://localhost/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
    labels:
      # Traefik configuration for frontend
      - "traefik.enable=${TRAEFIK_ENABLE_FRONTEND:-true}"
      - "traefik.http.routers.frontend.rule=Host(`${FRONTEND_DOMAIN:-study.suantechs.com}`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=${TRAEFIK_CERTRESOLVER:-letsencrypt}"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.frontend-http.rule=Host(`${FRONTEND_DOMAIN:-study.suantechs.com}`)"
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.middlewares=redirect-to-https"

volumes:
  postgres_data:


networks:
  app-network:
    driver: bridge
  dokploy-network:
    external: true
